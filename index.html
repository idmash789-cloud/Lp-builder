fy-content:space-between;padding:11px 14px;background:#19243b}.preview-frame{background:#eee;max-height:72vh;overflow:auto;scrollbar-color:#8490aa #e4e8f0}.preview-frame.mobile .lp{max-width:390px;margin:auto}.lp{font-family:Arial,sans-serif;min-height:600px;background:white;color:#1a2231}.lp section{position:relative;text-align:center;padding:45px 24px;min-height:100px}.lp section.editable:hover{outline:3px dashed #8b5cf6;outline-offset:-3px;cursor:pointer}.lp section.chosen{outline:3px solid #7c50e7;outline-offset:-3px}.lp h1{font-size:clamp(30px,4vw,52px);line-height:1.12;margin:0 0 14px}.lp h2{font-size:clamp(24px,3vw,38px);margin:0 0 14px}.lp p{line-height:1.6}.lp .cta{display:inline-block;padding:15px 23px;border-radius:12px;font-weight:800;text-decoration:none;margin-top:14px}.lp .price{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}.lp .price strong{font-size:32px}.lp img{max-width:100%;border-radius:12px;max-height:330px;object-fit:cover}.lp .gallery{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.lp .gallery img{width:30%;min-width:120px}.lp .tick{font-size:18px;font-weight:700}.lp .clock{font-size:38px;font-weight:900;letter-spacing:.08em}.notice{position:fixed;z-index:100;background:white;color:#182034;padding:14px 18px;border-radius:12px;box-shadow:0 15px 30px #0003;max-width:290px;font-size:13px}.template-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}.template-preview{height:175px;overflow:hidden;border-radius:10px;position:relative}.template-preview .minihero{height:100%;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.template-preview h4{font-size:21px;margin:6px}.template-preview p{font-size:11px;margin:0}.template-preview .mockbutton{font-size:11px;padding:8px 18px;border-radius:9px;margin:15px}.template-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px}.modal{position:fixed let state;try{state=JSON.parse(localStorage.getItem('lpstudio-v1'))}catch{}state={settings:{...defaults,...(state?.settings||{}),elements:{...defaults.elements,...(state?.settings?.elements||{})},notify:{...defaults.notify,...(state?.settings?.notify||{})},timer:{...defaults.timer,...(state?.settings?.timer||{})}},sections:Array.isArray(state?.sections)?state.sections:initialSections(),tab:'dashboard',step:0,selected:null,mode:'desktop',editing:true,category:'Semua',...{}};let history=[],future=[],timerId,notifId;const snapshot=()=>JSON.stringify({settings:state.settings,sections:state.sections});const save=()=>localStorage.setItem('lpstudio-v1',snapshot());function mutate(fn){history.push(snapshot());if(history.length>60)history.shift();future=[];fn();save();render()}function undo(){if(!history.length)return;future.push(snapshot());const p=JSON.parse(history.pop());Object.assign(state,p);save();render()}function redo(){if(!future.length)return;history.push(snapshot());Object.assign(state,JSON.parse(future.pop()));save();render()}function setTab(x){state.tab=x;render()}function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(window._toast);window._toast=setTimeout(()=>el.classList.add('hidden'),2500)}function setSetting(key,value){mutate(()=>{state.settings[key]=value})}function setElement(key,val){mutate(()=>{state.settings.elements[key]=val})}function field(label,key,type='text',hint=''){let s=state.settings;return `<label class="field">${label}${type==='textarea'?`<textarea data-setting="${key}">${esc(s[key])}</textarea>`:`<input data-setting="${key}" type="${type}" value="${esc(s[key])}">`}${hint?`<span class="help">${hint}</span>`:''}</label>`}function dropdown(label,key,groups){return `<label class="field">${label}<select data-setting="${key}">${groups.map(([name,opts])=>`<optgroup label="${esc(name)}">${opts.map(x=>`<option ${state.settings[key]===x?'selected':''}>${esc(x)}</option>`).join('')}</optgroup>`).join('')}</select></label>`}function sectionField(k,label,type='text'){const s=state.sections.find(s=>s.id===state.selected);return `<label class="field">${label}${type==='textarea'?`<textarea data-prop="${k}">${esc(s[k]||'')}</textarea>`:`<input type="${type}" data-prop="${k}" value="${esc(s[k]||'')}">`}</label>`}
function nav(){return `<aside class="side"><div class="brand"><span class="logo">◈</span> LP Studio <span class="pill">PRO</span></div><nav class="nav">${[['dashboard','▦','Dashboard'],['generator','✦','Prompt Generator'],['editor','▤','Visual Editor'],['templates','▧','Template Gallery'],['settings','⚙','Pengaturan']].map(([id,ic,txt])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}"><span>${ic}</span>${txt}</button>`).join('')}</nav><div class="sidefoot"><div class="small">LP Studio Premium • v1.0</div><div class="small">Auto-save di browser • HTML Export</div></div></aside>`}function header(){let titles={dashboard:'Dashboard',generator:'7-Step Prompt Generator',editor:'Visual Editor',templates:'Template Gallery',settings:'Pengaturan & Tracking'};return `<header class="header"><div><h1>${titles[state.tab]}</h1><p>Landing page profesional untuk kampanye yang lebih efektif</p></div><div class="actions"><button class="btn" id="undo" ${!history.length?'disabled':''}>↶ Undo</button><button class="btn" id="redo" ${!future.length?'disabled':''}>↷ Redo</button><button class="btn" id="export">⬇ Ekspor HTML</button><button class="btn primary" id="copyhtml">⧉ Copy HTML</button></div></header>`}function dashboard(){return `<div class="intro"><div class="eyebrow">WORKSPACE / OVERVIEW</div><h2>Bangun landing page yang menjual ✨</h2><p>Rancang prompt, pilih template, edit langsung, dan publish melalui platform pilihan Anda.</p></div><div class="grid"><div class="card"><div class="muted">Section aktif</div><div class="stat">${state.sections.length}</div><span class="status">● Tersimpan otomatis</span></div><div class="card"><div class="muted">Template tersedia</div><div class="stat">${palette.length}</div><span class="small">8 kategori kreatif</span></div><div class="card"><div class="muted">Platform tujuan</div><div class="stat" style="font-size:21px">${esc(state.settings.platform)}</div><span class="small">HTML siap dipublikasikan</span></div></div><hr class="line"><div class="grid"><div class="card"><h3>✦ Prompt Generator</h3><p class="muted">7 langkah menghasilkan brief copywriting dan desain yang lengkap.</p><button class="btn primary" data-tab="generator">Mulai Generator →</button></div><div class="card"><h3>▤ Visual Editor</h3><p class="muted">Klik section, ubah desain, dan atur urutan. Lihat preview real-time.</p><button class="btn primary" data-tab="editor">Buka Editor →</button></div><div class="card"><h3>▧ Template Premium</h3><p class="muted">${palette.length} template siap pakai untuk beragam kebutuhan.</p><button class="btn primary" data-tab="templates">Pilih Template →</button></div></div><hr class="line"><div class="card"><h3>Alur kerja yang direkomendasikan</h3><p class="guide">① Isi data produk dan penawaran di Prompt Generator → ② Generate prompt untuk AI di chat.z.ai → ③ Pilih template → ④ Edit section dan tombol di Visual Editor → ⑤ Atur Pixel ID → ⑥ Ekspor HTML lalu tempel di platform yang mendukung kode HTML.</p></div>`}
const steps=['Framework','Tone','Produk','Target','Detail','Desain','Platform'];function wizardContent(){let s=state.settings;switch(state.step){case 0:return dropdown('Framework Copywriting','framework',[['Konversi',['AIDA','PAS','BAB','4P','QUEST']],['Storytelling',['StoryBrand','Before–After','Problem–Agitate–Solve']],['Penawaran',['Direct Response','Value Proposition']]]);case 1:return dropdown('Tone Komunikasi','tone',[['Sales',['Persuasif','Urgency','Emosional','Hard Selling','Soft Selling']],['Brand',['Profesional','Friendly','Premium','Minimalis','Inspiratif']],['Audiens',['Santai Indonesia','Formal Indonesia','Storytelling Personal']]]);case 2:return `<div class="fields">${field('Nama Produk','name')}${dropdown('Jenis Produk','product',[['Fisik',['Produk Fisik','Kesehatan','Kecantikan','Fashion','Makanan & Minuman']],['Digital',['Produk Digital','Software / SaaS','E-Book','Kursus Online','Membership']],['Layanan',['Jasa / Agency','Konsultasi','Properti','Event']]])}${field('Deskripsi Produk','description','textarea')}${field('Keunggulan Utama','benefits','textarea')}</div>`;case 3:return `<div class="fields">${field('Target Market','audience','textarea')}${field('Masalah / Pain Point','problem','textarea')}</div>`;case 4:return `<div class="fields">${field('Harga Normal (Rp)','normal','number')}${field('Harga Promo (Rp)','promo','number')}${field('Harga Coret (Rp)','strike','number')}${field('Harga Final (Rp)','final','number')}${field('Teks CTA','cta')}${field('Link Checkout','link','url')}<div class="full"><h3>Elemen Tambahan</h3><div class="toggles">${Object.keys(s.elements).map(k=>`<label class="toggle"><input type="checkbox" data-element="${k}" ${s.elements[k]?'checked':''}>${({proof:'Social Proof',testimonial:'Testimonial',faq:'FAQ',bonus:'Bonus',guarantee:'Guarantee',scarcity:'Scarcity',comparison:'Comparison'})[k]}</label>`).join('')}</div></div></div>`;case 5:return `<div class="fields">${field('Warna Brand','brand','color')}${field('Warna Aksen','accent','color')}${dropdown('Gaya Desain','font',[['Modern',['Inter, Arial, sans-serif','Arial, sans-serif','Trebuchet MS, sans-serif']],['Editorial',['Georgia, serif','Times New Roman, serif']]])}</div>`;case 6:return `<div class="fields">${dropdown('Platform Target','platform',[['Website Builder',['Scalev','Lynk.id','WordPress','Shopify']],['Universal',['Copy HTML']]])}${field('Facebook Pixel ID (opsional)','pixel','text')}</div><p class="muted">Pastikan platform tujuan mengizinkan HTML/JavaScript kustom dan pemasangan Pixel.</p>`}}function generatePrompt(){const s=state.settings;return `BERTINDAK SEBAGAI: pakar conversion copywriting dan desain landing page premium.\n\nFRAMEWORK: ${s.framework}\nTONE: ${s.tone}\nPRODUK: ${s.name}\nKATEGORI: ${s.product}\nDESKRIPSI: ${s.description}\nTARGET MARKET: ${s.audience}\nMASALAH UTAMA: ${s.problem}\nBENEFIT: ${s.benefits}\n\nSTRUKTUR HARGA (jangan tertukar):\n- Harga Normal: ${money(s.normal)}\n- Harga Promo: ${money(s.promo)}\n- Harga Coret: ${money(s.strike)}\n- Harga Final (checkout): ${money(s.final)}\n\nELEMEN AKTIF: ${Object.entries(s.elements).filter(([k,v])=>v).map(([k])=>k).join(', ')||'Tidak ada'}\nCTA: ${s.cta}\nURL CTA: ${s.link}\n\nDESAIN: Premium, responsive/mobile-first, brand ${s.brand}, aksen ${s.accent}, font ${s.font}. Pastikan kontras, hirarki tipografi, dan loading efisien.\nPLATFORM TARGET: ${s.platform}.\nFACEBOOK PIXEL ID: ${s.pixel||'Tidak disetel'}. Pasang event hanya jika ada persetujuan tracking sesuai kebijakan privasi.\n\nBUAT: heading, subheading, story, benefit, visual direction, offer, social proof/testimoni hanya jika ada data nyata, FAQ, CTA kuat, dan HTML/CSS/JS mandiri yang valid. Hindari klaim berlebihan, testimonial palsu, countdown palsu, atau manipulasi pembeli. Sertakan petunjuk penerapan untuk ${s.platform}.`};function generator(){return `<div class="intro"><div class="eyebrow">7-STEP BUILDER</div><h2>AI Prompt Generator</h2><p>Susun instruksi lengkap untuk menghasilkan landing page yang sesuai dengan produk Anda.</p></div><div class="wizard"><div class="stepnav">${steps.map((x,i)=>`<button data-step="${i}" class="${state.step===i?'active':''}"><b>${i+1}.</b> ${x}</button>`).join('')}</div><div><div class="card"><div class="bar" style="justify-content:space-between"><h3>Langkah ${state.step+1}: ${steps[state.step]}</h3><span class="pill">${state.step+1} / 7</span></div>${wizardContent()}<div class="bar" style="justify-content:space-between;margin-top:22px"><button class="btn" id="prev" ${state.step===0?'disabled':''}>← Sebelumnya</button><button class="btn primary" id="next">${state.step===6?'Lihat Hasil':'Berikutnya →'}</button></div></div><div class="card" style="margin-top:15px"><div class="bar" style="justify-content:space-between"><h3>Prompt Siap Pakai</h3><span class="pill">Live Generator</span></div><pre class="output" id="prompt-output">${esc(generatePrompt())}</pre><div class="bar"><button class="btn primary" id="copy-prompt">⧉ Copy Prompt</button><button class="btn" id="open-zai">↗ Copy & Buka chat.z.ai</button></div></div></div></div>`}
function renderSection(s,live=false){const S=state.settings,btntext=s.button||S.cta,url=s.link||S.link;let body='';let lines=s.text.split('\n').filter(Boolean);const button=(txt=btntext)=>`<a class="cta" href="${esc(url)}" data-event="${esc(s.pixelEvent||'Lead')}" style="background:${esc(S.accent)};color:#182034" ${live?'':state.editing?'onclick="return false"':'target="_blank" rel="noopener noreferrer"'}>${esc(txt)}</a>`;if(s.type==='hero')body=`<h1>${esc(s.text)}</h1><p>${esc(S.description)}</p>${button()}`;else if(s.type==='benefits')body=`<h2>${esc(s.title)}</h2>${lines.map(x=>`<p class="tick">${esc(x)}</p>`).join('')}`;else if(s.type==='offer')body=`<h2>${esc(s.text)}</h2><p>Penawaran terbatas untuk ${esc(S.name)}</p><div class="price"><s>${money(S.strike)}</s><strong>${money(S.final)}</strong></div><p>Harga Normal ${money(S.normal)} • Harga Promo ${money(S.promo)}</p>${button()}`;else if(s.type==='image')body=`<h2>${esc(s.text)}</h2>${s.image?`<img src="${esc(s.image)}" alt="${esc(s.text)}">`:'<p>🖼️ Isi URL gambar di panel kanan</p>'}`;else if(s.type==='gallery')body=`<h2>${esc(s.title)}</h2><div class="gallery">${s.images.split('\n').filter(Boolean).map(u=>`<img src="${esc(u)}" loading="lazy" alt="Galeri">`).join('')||'<p>Tambahkan satu URL gambar per baris di panel kanan</p>'}</div>`;else if(s.type==='countdown')body=`<h2>${esc(s.text)}</h2><div class="clock" data-countdown="${(+S.timer.hours||0)*3600+(+S.timer.minutes||0)*60+(+S.timer.seconds||0)}">00:00:00</div>`;else if(s.type==='video')body=`<h2>${esc(s.text)}</h2>${s.video?`<video controls playsinline style="width:100%;max-width:680px" src="${esc(s.video)}"></video>`:'<p>Masukkan URL MP4 pada panel kanan</p>'}`;else if(s.type==='faq')body=`<h2>FAQ</h2>${lines.map((l,i)=>i%2===0?`<details style="margin:10px auto;max-width:650px;text-align:left;padding:12px;border:1px solid #ccc;border-radius:9px"><summary>${esc(l)}</summary><p>${esc(lines[i+1]||'Hubungi kami untuk informasi lebih lanjut.')}</p></details>`:'').join('')}`;else if(s.type==='notify')body=`<h2>Notifikasi Penjualan</h2><p>${esc(S.notify.text)}</p>`;else body=`<h2>${esc(s.title)}</h2><p style="white-space:pre-line">${esc(s.text)}</p>${s.button?button(s.button):''}`;return `<section ${live?'':`data-section="${s.id}" class="editable ${state.selected===s.id?'chosen':''}"`} style="background:${esc(s.bg)};color:${esc(s.color)};font-family:${esc(S.font)}">${body}</section>`}
function previewHtml(live=false){let S=state.settings;return `<div class="lp">${state.sections.map(s=>renderSection(s,live)).join('')}</div>`}function addSection(type){mutate(()=>{let s=section(type);state.sections.push(s);state.selected=s.id})}function changeSection(id,key,value){mutate(()=>{let s=state.sections.find(x=>x.id===id);if(s)s[key]=value})}function moveSection(id,dir){mutate(()=>{let i=state.sections.findIndex(s=>s.id===id),j=i+dir;if(j>=0&&j<state.sections.length){let a=state.sections;[a[i],a[j]]=[a[j],a[i]]}})}function duplicateSection(id){mutate(()=>{let i=state.sections.findIndex(s=>s.id===id),copy={...state.sections[i],id:uid()};state.sections.splice(i+1,0,copy);state.selected=copy.id})}function deleteSection(id){mutate(()=>{state.sections=state.sections.filter(s=>s.id!==id);state.selected=null})}function editor(){const s=state.sections.find(s=>s.id===state.selected);return `<div class="switchbar"><button class="btn ${state.editing?'active':''}" id="edit-toggle">${state.editing?'✎ Edit Mode ON':'◉ Preview Mode'}</button><button class="btn ${state.mode==='desktop'?'active':''}" data-mode="desktop">▱ Desktop</button><button class="btn ${state.mode==='mobile'?'active':''}" data-mode="mobile">▯ Mobile</button></div><div class="editor"><div class="card"><h3>Sections (${state.sections.length})</h3><div class="sections">${state.sections.map((s,i)=>`<div class="sectionrow ${s.id===state.selected?'selected':''}" draggable="true" data-drag="${s.id}"><button class="name" data-select="${s.id}">☷ ${esc(s.title)}</button><button class="mini" title="Naik" data-move="${s.id}:-1" ${i===0?'disabled':''}>↑</button><button class="mini" title="Turun" data-move="${s.id}:1" ${i===state.sections.length-1?'disabled':''}>↓</button></div>`).join('')}</div><hr class="line"><label class="field">Tambah Section<select id="add-type"><option value="">+ Pilih section...</option>${['hero','text','benefits','offer','proof','testimonial','faq','bonus','guarantee','comparison','image','gallery','video','countdown','notify'].map(x=>`<option value="${x}">${esc(section(x).title)}</option>`).join('')}</select></label><p class="help">Drag & drop atau gunakan tombol panah untuk mengubah urutan.</p></div><div class="preview-shell"><div class="preview-bar"><b>Live Preview</b><span class="small">${state.editing?'Klik section untuk mengedit':'Tampilan pengunjung'}</span></div><div class="preview-frame ${state.mode}" id="preview-frame">${previewHtml(false)}</div></div><div class="card properties"><h3>✎ Properti Section</h3>${s?`${sectionField('title','Nama Section')}${sectionField('text','Judul / Copywriting','textarea')}${['hero','offer','text','testimonial','bonus','guarantee','proof','comparison'].includes(s.type)?sectionField('button','Teks Tombol'):''}${sectionField('link','URL Tombol','url')}${s.type==='image'?sectionField('image','URL Gambar','url'):''}${s.type==='gallery'?sectionField('images','URL Gambar (per baris)','textarea'):''}${s.type==='video'?sectionField('video','URL Video MP4','url'):''}${sectionField('bg','Background','color')}${sectionField('color','Warna Teks','color')}<label class="field">Facebook Pixel Event<select data-prop="pixelEvent">${['','PageView','ViewContent','Lead','InitiateCheckout','AddToCart','Purchase','Contact','CompleteRegistration'].map(x=>`<option value="${x}" ${s.pixelEvent===x?'selected':''}>${x||'Tidak ada'}</option>`).join('')}</select></label><div class="bar"><button class="btn" id="duplicate">⧉ Duplicate</button><button class="btn danger" id="delete">🗑 Delete</button></div>`:'<div class="empty">Klik section di preview atau daftar di kiri untuk mengedit</div>'}</div></div>`}
function templates(){return `<div class="intro"><div class="eyebrow">TEMPLATE LIBRARY</div><h2>${palette.length} Template Premium</h2><p>Preview live, pilih kategori, lalu gunakan sebagai fondasi landing page Anda.</p></div><div class="bar" style="margin-bottom:18px"><button class="btn ${state.category==='Semua'?'primary':''}" data-category="Semua">Semua</button>${[...new Set(palette.map(p=>p[0]))].map(x=>`<button class="btn ${state.category===x?'primary':''}" data-category="${x}">${x}</button>`).join('')}</div><div class="template-grid">${palette.map((p,i)=>({p,i})).filter(x=>state.category==='Semua'||x.p[0]===state.category).map(({p,i})=>`<div class="card"><div class="template-preview"><div class="minihero" style="background:${p[2]};color:${p[3]}"><span class="small" style="color:inherit">${p[0].toUpperCase()} / PREMIUM</span><h4>${p[1]}</h4><p>Landing Page yang Mengubah Pengunjung Jadi Pelanggan</p><span class="mockbutton" style="background:${p[3]};color:${p[2]}">Mulai Sekarang →</span></div></div><div class="template-foot"><div><b>${p[1]}</b><div class="small">${p[0]}</div></div><span class="pill">Premium</span></div><div class="bar" style="margin-top:13px"><button class="btn" data-preview-template="${i}">Preview</button><button class="btn primary" data-use-template="${i}">Gunakan</button></div></div>`).join('')}</div>`}function useTemplate(index){const p=palette[index];mutate(()=>{state.settings.brand=p[2];state.settings.accent=p[3];state.sections=initialSections().map((s,i)=>({...s,bg:i===0?p[2]:i%2?'#ffffff':'#f5f5fa',color:i===0?p[3]:'#1e293b'}));state.selected=null;state.tab='editor'});toast(`Template ${p[1]} diterapkan`)}function previewTemplate(index){const p=palette[index];const html=`<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font-family:Arial;text-align:center}section{padding:65px 20px}h1{font-size:clamp(32px,6vw,65px)}button{background:${p[3]};color:${p[2]};border:0;padding:17px 26px;border-radius:11px;font-weight:bold}</style><section style="background:${p[2]};color:${p[3]}"><p>${p[0]}</p><h1>${p[1]}</h1><p>Solusi Profesional untuk Performa Bisnis Lebih Tinggi</p><button>Mulai Sekarang →</button></section><section><h1>Nilai yang berbeda</h1><p>Desain responsive, manfaat jelas, dan call to action yang kuat.</p></section><section style="background:#f3f3fa"><h1>Penawaran Eksklusif</h1><p>Konversi lebih baik dengan pengalaman lebih sederhana.</p><button>Dapatkan Sekarang</button></section>`;$('#modal-title').textContent=p[1]+' • Preview Full Screen';$('#modal-frame').srcdoc=html;$('#modal').classList.remove('hidden')};function closeModal(){$('#modal').classList.add('hidden');$('#modal-frame').srcdoc=''}
function settingsPage(){let s=state.settings,n=s.notify,t=s.timer;return `<div class="grid"><div class="card"><h3>🎯 Facebook Pixel Integration</h3>${field('Facebook Pixel ID','pixel','text','Hanya angka. Pixel event aktif di HTML hasil ekspor setelah persetujuan consent pengunjung.') }<p class="help">Event per link dapat dikonfigurasi lewat properti section di Visual Editor. Uji dengan Meta Pixel Helper.</p></div><div class="card"><h3>🛍️ Sales Notification</h3><label class="toggle"><input type="checkbox" data-notify="enabled" ${n.enabled?'checked':''}>Aktifkan notifikasi</label><div style="height:12px"></div>${[['text','Teks Popup','text'],['emoji','Emoji','text'],['interval','Interval (detik)','number'],['size','Ukuran font (px)','number'],['bg','Background','color'],['color','Warna Teks','color']].map(([k,l,type])=>`<label class="field" style="margin-bottom:9px">${l}<input data-notify="${k}" type="${type}" value="${esc(n[k])}"></label>`).join('')}<label class="field">Posisi<select data-notify="position">${['bottom-left','bottom-right','top-left','top-right'].map(x=>`<option ${n.position===x?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="card"><h3>⏱️ Countdown Timer</h3><p class="muted">Penghitungan berbasis durasi sesi (bukan deadline server). Untuk promo nyata, pastikan waktu berakhir benar dan transparan.</p>${[['hours','Jam'],['minutes','Menit'],['seconds','Detik']].map(([k,l])=>`<label class="field" style="margin-bottom:10px">${l}<input type="number" min="0" data-timer="${k}" value="${t[k]}"></label>`).join('')}<button class="btn" data-tab="editor">Tambahkan Timer di Editor →</button></div></div><hr class="line"><div class="card"><h3>📤 Integrasi Platform</h3><p class="guide">Scalev, Lynk.id, WordPress, dan Shopify mendukung berbagai bentuk konten, tetapi akses HTML/CSS/JavaScript khusus berbeda menurut editor dan paket. Unduh HTML sebagai halaman mandiri untuk hosting statis, atau tempel kode pada blok custom code bila didukung. Pixel dan notifikasi membutuhkan JavaScript yang diizinkan platform.</p><button class="btn primary" id="export-settings">Unduh Landing Page HTML</button></div>`}
function render(){const container=$('#app');let old=$('#preview-frame');const top=old?old.scrollTop:0;container.innerHTML=`<div class="app">${nav()}<main class="main">${header()}<div class="content">${({dashboard,generator,editor,templates,settings:settingsPage})[state.tab]()}</div></main></div>`;let newf=$('#preview-frame');if(newf)newf.scrollTop=top;bind();refreshCountdowns()}
function bind(){document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>setTab(x.dataset.tab));$('#undo').onclick=undo;$('#redo').onclick=redo;$('#export').onclick=exportHtml;$('#copyhtml').onclick=()=>copy(exportDocument());document.querySelectorAll('[data-setting]').forEach(x=>x.onchange=()=>setSetting(x.dataset.setting,x.value));document.querySelectorAll('[data-element]').forEach(x=>x.onchange=()=>setElement(x.dataset.element,x.checked));document.querySelectorAll('[data-step]').forEach(x=>x.onclick=()=>{state.step=+x.dataset.step;render()});if($('#prev'))$('#prev').onclick=()=>{state.step=Math.max(0,state.step-1);render()};if($('#next'))$('#next').onclick=()=>{state.step=Math.min(6,state.step+1);render();if(state.step===6)$('#prompt-output')?.scrollIntoView({block:'nearest'})};if($('#copy-prompt'))$('#copy-prompt').onclick=()=>copy(generatePrompt());if($('#open-zai'))$('#open-zai').onclick=()=>{copy(generatePrompt());window.open('https://chat.z.ai','_blank','noopener')};document.querySelectorAll('[data-category]').forEach(x=>x.onclick=()=>{state.category=x.dataset.category;render()});document.querySelectorAll('[data-preview-template]').forEach(x=>x.onclick=()=>previewTemplate(+x.dataset.previewTemplate));document.querySelectorAll('[data-use-template]').forEach(x=>x.onclick=()=>useTemplate(+x.dataset.useTemplate));document.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>{state.mode=x.dataset.mode;render()});if($('#edit-toggle'))$('#edit-toggle').onclick=()=>{state.editing=!state.editing;render()};document.querySelectorAll('[data-select]').forEach(x=>x.onclick=()=>{state.selected=x.dataset.select;render()});document.querySelectorAll('[data-section]').forEach(x=>x.onclick=e=>{if(state.editing){e.preventDefault();state.selected=x.dataset.section;render()}});document.querySelectorAll('[data-move]').forEach(x=>x.onclick=()=>{let [id,d]=x.dataset.move.split(':');moveSection(id,+d)});document.querySelectorAll('[data-drag]').forEach(x=>{x.ondragstart=e=>e.dataTransfer.setData('text/plain',x.dataset.drag);x.ondragover=e=>e.preventDefault();x.ondrop=e=>{e.preventDefault();let from=e.dataTransfer.getData('text/plain'),to=x.dataset.drag;if(from===to)return;mutate(()=>{let a=state.sections,fromIndex=a.findIndex(s=>s.id===from),toIndex=a.findIndex(s=>s.id===to);if(fromIndex<0||toIndex<0)return;let item=a.splice(fromIndex,1)[0];a.splice(toIndex,0,item)})}});if($('#add-type'))$('#add-type').onchange=x=>{if(x.target.value)addSection(x.target.value)};document.querySelectorAll('[data-prop]').forEach(x=>x.onchange=()=>changeSection(state.selected,x.dataset.prop,x.value));if($('#duplicate'))$('#duplicate').onclick=()=>duplicateSection(state.selected);if($('#delete'))$('#delete').onclick=()=>deleteSection(state.selected);document.querySelectorAll('[data-notify]').forEach(x=>x.onchange=()=>mutate(()=>{state.settings.notify[x.dataset.notify]=x.type==='checkbox'?x.checked:x.value}));document.querySelectorAll('[data-timer]').forEach(x=>x.onchange=()=>mutate(()=>{state.settings.timer[x.dataset.timer]=Math.max(0,+x.value||0)}));if($('#export-settings'))$('#export-settings').onclick=exportHtml}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Berhasil disalin ke clipboard')}catch{const box=document.createElement('textarea');box.value=t;document.body.appendChild(box);box.select();document.execCommand('copy');box.remove();toast('Teks disalin')}}function exportHtml(){const blob=new Blob([exportDocument()],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='landing-page-'+(state.settings.name||'produk').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('File HTML berhasil diunduh')}
function exportDocument(){const S=state.settings;const css=`*{box-sizing:border-box}body{margin:0} .lp{font-family:Arial,sans-serif;color:#182439}.lp section{padding:55px 20px;text-align:center}.lp h1{font-size:clamp(30px,5vw,55px);margin:0 0 18px}.lp h2{font-size:clamp(25px,4vw,39px)}.lp p{line-height:1.65}.lp .cta{display:inline-block;padding:15px 24px;border-radius:12px;text-decoration:none;font-weight:bold;margin-top:14px}.lp .price{display:flex;align-items:center;justify-content:center;gap:20px}.lp .price strong{font-size:38px}.lp img{max-width:100%;border-radius:12px;max-height:360px}.lp .gallery{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}.lp .gallery img{width:29%}.lp .clock{font-size:42px;font-weight:bold}.lp details{margin:10px auto;max-width:650px;text-align:left;padding:12px;border:1px solid #ddd;border-radius:8px}#sale-pop{position:fixed;z-index:999;background:${S.notify.bg};color:${S.notify.color};font-size:${Math.max(10,Number(S.notify.size)||14)}px;padding:14px 17px;max-width:290px;border-radius:12px;box-shadow:0 10px 30px #0003;display:none;${S.notify.position.includes('bottom')?'bottom:20px':'top:20px'};${S.notify.position.includes('right')?'right:20px':'left:20px'}}`;const time=JSON.stringify(S.timer),notify=JSON.stringify(S.notify),pixel=JSON.stringify(String(S.pixel||'').replace(/\D/g,''));const js=`(function(){const consent=()=>{try{return localStorage.getItem('lp_tracking_consent')==='yes'}catch{return false}};const pixel=${pixel};if(pixel&&consent()){!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=true;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=true;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');fbq('init',pixel);fbq('track','PageView')}document.querySelectorAll('[data-event]').forEach(el=>el.addEventListener('click',()=>{if(typeof fbq==='function'&&consent())fbq('track',el.dataset.event||'Lead')}));const duration=${(+S.timer.hours||0)*3600+(+S.timer.minutes||0)*60+(+S.timer.seconds||0)};document.querySelectorAll('[data-countdown]').forEach(el=>{const key='lp_timer_'+location.pathname;let end;try{end=Number(sessionStorage.getItem(key))||Date.now()+duration*1000;sessionStorage.setItem(key,end)}catch{end=Date.now()+duration*1000}const tick=()=>{let d=Math.max(0,Math.floor((end-Date.now())/1000));el.textContent=[Math.floor(d/3600),Math.floor(d%3600/60),d%60].map(x=>String(x).padStart(2,'0')).join(':')};tick();setInterval(tick,1000)});const notify=${notify};if(notify.enabled){const box=document.createElement('div');box.id='sale-pop';box.textContent=notify.emoji+' '+notify.text;document.body.appendChild(box);setInterval(()=>{box.style.display='block';setTimeout(()=>box.style.display='none',4000)},Math.max(6,Number(notify.interval)||12)*1000)}})();`;return `<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(S.name)} | Landing Page</title><style>${css}</style></head><body>${previewHtml(true)}<script>${js}${'<'+'/script>'}</body></html>`}
function refreshCountdowns(){clearInterval(timerId);const f=()=>{document.querySelectorAll('.preview-frame [data-countdown]').forEach(el=>{let v=Math.max(0,+el.dataset.countdown||0);if(!el.dataset.end)el.dataset.end=String(Date.now()+v*1000);let d=Math.max(0,Math.floor((+el.dataset.end-Date.now())/1000));el.textContent=[Math.floor(d/3600),Math.floor(d%3600/60),d%60].map(x=>String(x).padStart(2,'0')).join(':')})};f();timerId=setInterval(f,1000)}render();
</script></body></html>
